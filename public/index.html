<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Salas de transmissão</title>
<style>
  :root { --bg: #101418; --panel: #181e24; --line: #303a44; --text: #edf2f5; --muted: #94a2ad; --accent: #69a9ff; }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px; background: var(--bg); color: var(--text); font-family: "Aptos", "Segoe UI", sans-serif; }
  main { width: min(100%, 560px); }
  .eyebrow { color: var(--accent); font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
  h1 { margin: 10px 0; font-size: clamp(30px, 6vw, 46px); line-height: 1.05; }
  p { color: var(--muted); line-height: 1.5; }
  section { margin-top: 28px; padding: 22px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; }
  label { display: block; margin-bottom: 8px; color: #cbd4db; font-size: 13px; font-weight: 700; }
  input { width: 100%; padding: 13px; border: 1px solid var(--line); border-radius: 7px; background: #202830; color: var(--text); font: inherit; text-transform: lowercase; }
  .actions { display: flex; gap: 10px; margin-top: 14px; }
  button { flex: 1; padding: 12px 16px; border: 0; border-radius: 7px; background: #4389e8; color: white; font: inherit; font-weight: 700; cursor: pointer; }
  button.secondary { background: transparent; border: 1px solid var(--line); color: var(--text); }
  button:hover { filter: brightness(1.1); }
  @media (max-width: 520px) { .actions { flex-direction: column; } }
</style>
</head>
<body>
<main>
  <div class="eyebrow">Sala com voz, câmera e tela</div>
  <h1>Crie ou entre em uma sala</h1>
  <p>Todo mundo na sala pode conversar por microfone e compartilhar câmera ou tela quando quiser, como em um servidor de voz.</p>
  <section>
    <label for="roomCode">Código da sala</label>
    <input id="roomCode" maxlength="32" placeholder="ex.: reuniao-123" autocomplete="off">
    <div class="actions">
      <button id="createBtn">Criar sala</button>
      <button id="joinBtn" class="secondary">Entrar na sala</button>
    </div>
  </section>
</main>
<script>
const roomCode = document.getElementById('roomCode');
const normalize = value => value.trim().toLowerCase().replace(/[^a-z0-9_-]/g, '-').replace(/-+/g, '-').replace(/^-|-$/g, '');
function openRoom(code) {
  const normalized = normalize(code);
  if (normalized.length < 4) { roomCode.focus(); return; }
  window.location.href = `/${encodeURIComponent(normalized)}/sala`;
}
document.getElementById('createBtn').onclick = () => openRoom(`sala-${Math.random().toString(36).slice(2, 8)}`);
document.getElementById('joinBtn').onclick = () => openRoom(roomCode.value);
roomCode.addEventListener('keydown', event => { if (event.key === 'Enter') openRoom(roomCode.value); });
</script>
</body>
</html>
