<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ao Vivo</title>
<style>
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: #0f1115;
    color: #eee;
    text-align: center;
    padding: 40px 20px;
    margin: 0;
  }
  h1 { font-weight: 600; }
  video {
    width: 95%;
    max-width: 960px;
    border-radius: 10px;
    border: 2px solid #333;
    background: #000;
    margin-top: 20px;
  }
  #status { margin-top: 14px; color: #7fd1ff; font-size: 14px; }
  button {
    padding: 10px 22px;
    margin-top: 16px;
    border: none;
    border-radius: 8px;
    background: #4f8cff;
    color: #fff;
    cursor: pointer;
    font-size: 14px;
  }
  button:hover { background: #3a76e0; }
  .shareLink { display: inline-block; margin-top: 18px; color: #8fb7ff; }
</style>
</head>
<body>
  <h1>Assistindo ao vivo</h1>
  <p id="status">Aguardando transmissao...</p>
  <video id="remoteVideo" autoplay playsinline controls></video>
  <br>
  <button id="unmuteBtn" style="display:none;">Ativar som</button>
  <br>
  <a class="shareLink" href="/compartilhar">Compartilhar minha tela</a>

<script src="/socket.io/socket.io.js"></script>
<script>
const socket = io();
const remoteVideo = document.getElementById('remoteVideo');
const status = document.getElementById('status');
const unmuteBtn = document.getElementById('unmuteBtn');

let rtcConfig = { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] };
const rtcConfigReady = fetch('/api/rtc-config')
  .then(response => response.json())
  .then(config => { rtcConfig = config; })
  .catch(() => {});

let pc = null;
let broadcasterId = null;

function criarConexao() {
  pc = new RTCPeerConnection(rtcConfig);

  pc.ontrack = (event) => {
    if (remoteVideo.srcObject !== event.streams[0]) {
      remoteVideo.srcObject = event.streams[0];
      status.textContent = 'Conectado! Recebendo transmissao ao vivo.';
    }
  };

  pc.onicecandidate = (event) => {
    if (event.candidate && broadcasterId) {
      socket.emit('candidate', broadcasterId, event.candidate);
    }
  };

  pc.onconnectionstatechange = () => {
    if (pc.connectionState === 'connected') {
      status.textContent = 'Conectado! Recebendo transmissao ao vivo.';
    }
  };
}

socket.on('offer', (id, description) => {
  broadcasterId = id;
  if (!pc) criarConexao();
  pc.setRemoteDescription(description)
    .then(() => pc.createAnswer())
    .then(answer => pc.setLocalDescription(answer))
    .then(() => socket.emit('answer', id, pc.localDescription));
});

socket.on('candidate', (id, candidate) => {
  if (pc) pc.addIceCandidate(new RTCIceCandidate(candidate)).catch(() => {});
});

socket.on('broadcaster-online', () => {
  status.textContent = 'Transmissao encontrada, conectando...';
  socket.emit('watcher');
});

socket.on('broadcaster-offline', () => {
  status.textContent = 'A transmissao foi encerrada.';
  if (pc) { pc.close(); pc = null; }
  remoteVideo.srcObject = null;
  broadcasterId = null;
});

socket.on('broadcaster-replaced', () => {
  status.textContent = 'Outra pessoa iniciou uma nova transmissao.';
  if (pc) { pc.close(); pc = null; }
  remoteVideo.srcObject = null;
  broadcasterId = null;
  socket.emit('watcher');
});

// Ao carregar a pagina, ja avisa que quer assistir (caso a transmissao ja esteja rolando)
rtcConfigReady.then(() => socket.emit('watcher'));

// Navegadores bloqueiam autoplay com som; o video comeca mudo e o usuario ativa manualmente
remoteVideo.addEventListener('play', () => {
  if (remoteVideo.muted) unmuteBtn.style.display = 'inline-block';
});

unmuteBtn.onclick = () => {
  remoteVideo.muted = false;
  unmuteBtn.style.display = 'none';
};
</script>
</body>
</html>
