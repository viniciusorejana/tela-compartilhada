<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Nexo</title>
<!-- A tela de abertura do aplicativo de mesa: a janela mostra isto, na hora, enquanto o servidor responde (o
     endereço, a conexão, o HTML chegando), e é trocada pela sala quando ela está pronta. É o mesmo desenho da
     tela de carregamento da sala (public/carregando.{css,js}, docs/interface.md 4.19), com as cores escritas à
     mão porque aqui não há tema.css -- o aplicativo abre sempre no escuro. -->
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0; display: grid; place-items: center; overflow: hidden; padding: 24px;
    background: #12131c; color: #eeeef5; font: 14px/1.45 "Segoe UI", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased; user-select: none;
  }
  body::before {
    content: ''; position: absolute; inset: -25%;
    background: radial-gradient(ellipse 46% 40% at 50% 40%, #8879f633, transparent 72%),
      radial-gradient(ellipse 30% 26% at 84% 80%, #90dfb31f, transparent 70%),
      radial-gradient(ellipse 34% 30% at 12% 86%, #8879f61f, transparent 70%);
    animation: aurora 16s ease-in-out infinite alternate; opacity: 0; transition: opacity .9s cubic-bezier(.2, .8, .2, 1);
  }
  body::after {
    content: ''; position: absolute; inset: 0; opacity: 0; transition: opacity .9s cubic-bezier(.2, .8, .2, 1);
    background-image: radial-gradient(#ffffff17 1px, transparent 1.5px); background-size: 28px 28px;
    -webkit-mask: radial-gradient(ellipse 70% 60% at 50% 45%, #000, transparent 78%);
    mask: radial-gradient(ellipse 70% 60% at 50% 45%, #000, transparent 78%);
  }
  /* Os três graus da espera, como na tela da sala (public/carregando.css, "Os três graus"): nasce só a marca, e o resto
     entra em fusão se a abertura se alonga -- o grau está em `body[data-nivel]`, posto pelo script daqui de baixo. */
  body[data-nivel="2"]::before { opacity: 1; } body[data-nivel="2"]::after { opacity: .35; }
  body[data-nivel="3"]::before { opacity: 1; } body[data-nivel="3"]::after { opacity: .7; }
  @keyframes aurora { to { transform: translate3d(2%, -2%, 0) scale(1.06); } }
  .caixa { position: relative; z-index: 1; display: grid; justify-items: center; width: min(100%, 360px); text-align: center; }
  .emblema { position: relative; width: 168px; height: 168px; zoom: 1; transition: zoom .8s cubic-bezier(.2, .8, .2, 1); }
  body[data-nivel="1"] .emblema { zoom: .62; } body[data-nivel="2"] .emblema { zoom: .82; }
  .resto { display: grid; width: 100%; grid-template-rows: 0fr; transition: grid-template-rows .8s cubic-bezier(.2, .8, .2, 1); }
  .miolo { min-height: 0; display: grid; justify-items: center; overflow: clip; overflow-clip-margin: 14px; }
  body:is([data-nivel="2"], [data-nivel="3"]) .resto-2, body[data-nivel="3"] .resto-3 { grid-template-rows: 1fr; }
  .resto-2 > .miolo > :is(.titulo, .etapa, .devagar), .resto-3 > .miolo > * { opacity: 0; transition: opacity .7s cubic-bezier(.2, .8, .2, 1) .15s; }
  body:is([data-nivel="2"], [data-nivel="3"]) .resto-2 > .miolo > :is(.titulo, .etapa, .devagar), body[data-nivel="3"] .resto-3 > .miolo > * { opacity: 1; }
  .orbita { opacity: 0; transition: opacity 1s cubic-bezier(.2, .8, .2, 1); } body[data-nivel="3"] .orbita { opacity: 1; }
  .emblema > svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
  .trilha { fill: none; stroke: #ffffff26; stroke-width: 3; }
  .arco { fill: none; stroke: #a092ff; stroke-width: 3.5; stroke-linecap: round; filter: drop-shadow(0 0 6px #8879f6); transition: stroke-dasharray .5s cubic-bezier(.2, .8, .2, 1); }
  .orbita { position: absolute; inset: -18px; border: 1px dashed #ffffff29; border-radius: 50%; animation: giro 32s linear infinite; }
  .orbita i { position: absolute; width: 11px; height: 11px; color: #f1d58c; }
  .orbita i:nth-child(1) { left: calc(50% - 5.5px); top: -5.5px; }
  .orbita i:nth-child(2) { right: 14px; bottom: 14px; width: 8px; height: 8px; color: #a6e7c4; animation: cintila 2.8s ease-in-out infinite alternate; }
  .orbita i:nth-child(3) { left: 12px; bottom: 22px; width: 7px; height: 7px; color: #c7bcff; animation: cintila 3.4s ease-in-out infinite alternate-reverse; }
  .estrela { display: block; width: 100%; height: 100%; fill: currentColor; }
  .ponta { position: absolute; inset: 0; transition: transform .5s cubic-bezier(.2, .8, .2, 1); }
  .ponta i { position: absolute; left: calc(50% - 9px); top: -1px; width: 18px; height: 18px; color: #a092ff; filter: drop-shadow(0 0 7px #8879f6); }
  .marca { position: absolute; inset: 42px; border-radius: 26px; box-shadow: 0 14px 40px #8879f661; animation: flutuar 3.6s ease-in-out infinite alternate; }
  .marca svg { display: block; width: 100%; height: 100%; border-radius: 26px; }
  @keyframes giro { to { transform: rotate(360deg); } }
  @keyframes flutuar { from { transform: translateY(2px); } to { transform: translateY(-3px); } }
  @keyframes cintila { from { opacity: .25; transform: scale(.8); } to { opacity: 1; transform: scale(1.1); } }
  .titulo { margin-top: 24px; font-size: 19px; font-weight: 650; letter-spacing: -.02em; line-height: 1.25; }
  .etapa { margin: 6px 0 0; color: #a2a2b8; font-size: 12px; min-height: 1.5em; }
  .pontos { display: inline-flex; gap: 3px; margin-left: 4px; vertical-align: middle; }
  .pontos i { width: 4px; height: 4px; border-radius: 50%; background: currentColor; animation: pulo 1.2s ease-in-out infinite both; }
  .pontos i:nth-child(2) { animation-delay: .15s; }
  .pontos i:nth-child(3) { animation-delay: .3s; }
  @keyframes pulo { 0%, 70%, 100% { opacity: .25; transform: translateY(0); } 35% { opacity: 1; transform: translateY(-3px); } }
  .xp { width: min(100%, 300px); margin-top: 22px; display: grid; gap: 8px; }
  .seg { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 3px; }
  .seg i { height: 8px; border-radius: 3px; background: #ffffff14; transition: background-color .17s, box-shadow .17s; }
  .seg i.on { background: #8879f6; box-shadow: 0 0 10px #8879f633; }
  .seg i.prox { background: #8879f633; animation: respira 1.4s ease-in-out infinite alternate; }
  @keyframes respira { from { opacity: .45; } to { opacity: 1; } }
  .rotulos { display: flex; justify-content: space-between; color: #8f8ea6; font-size: 10px; font-weight: 750; letter-spacing: .1em; text-transform: uppercase; }
  .rotulos b { color: #c7bcff; font-weight: 750; font-variant-numeric: tabular-nums; }
  .dica { width: 100%; min-height: 72px; margin-top: 24px; display: grid; align-content: start; gap: 5px; padding: 12px 14px; border-radius: 14px; background: #ffffff08; box-shadow: inset 0 0 0 1px #ffffff0d; text-align: left; }
  .dica small { color: #c7bcff; font-size: 10px; font-weight: 750; letter-spacing: .12em; text-transform: uppercase; }
  .dica p { margin: 0; color: #cfcde0; font-size: 12px; line-height: 1.55; transition: opacity .24s cubic-bezier(.2, .8, .2, 1); }
  .dica p.troca { opacity: 0; }
  .devagar { display: none; margin-top: 18px; color: #f1d58c; font-size: 12px; max-width: 320px; }
  body.devagar-sim .devagar { display: block; }
  @media (max-height: 520px) { .dica { display: none; } .emblema { width: 124px; height: 124px; } .titulo { margin-top: 14px; } .marca { inset: 30px; border-radius: 19px; } .marca svg { border-radius: 19px; } }
  /* Menos movimento: o sistema pediu, e o aplicativo respeita. O emblema e a barra continuam, parados. */
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation-duration: 1ms !important; animation-iteration-count: 1 !important; transition-duration: 1ms !important; } .orbita, body::before { display: none; } }
</style>
</head>
<body>
<main class="caixa" role="status" aria-live="polite">
  <div class="emblema" aria-hidden="true">
    <div class="orbita">
      <i><svg class="estrela" viewBox="38 10 12 12"><path d="m44 10 1.7 4.3L50 16l-4.3 1.7L44 22l-1.7-4.3L38 16l4.3-1.7z"/></svg></i>
      <i><svg class="estrela" viewBox="38 10 12 12"><path d="m44 10 1.7 4.3L50 16l-4.3 1.7L44 22l-1.7-4.3L38 16l4.3-1.7z"/></svg></i>
      <i><svg class="estrela" viewBox="38 10 12 12"><path d="m44 10 1.7 4.3L50 16l-4.3 1.7L44 22l-1.7-4.3L38 16l4.3-1.7z"/></svg></i>
    </div>
    <svg viewBox="0 0 168 168"><circle class="trilha" cx="84" cy="84" r="76"/><circle class="arco" id="arco" cx="84" cy="84" r="76" transform="rotate(-90 84 84)" stroke-dasharray="0 477.5"/></svg>
    <div class="ponta" id="ponta"><i><svg class="estrela" viewBox="38 10 12 12"><path d="m44 10 1.7 4.3L50 16l-4.3 1.7L44 22l-1.7-4.3L38 16l4.3-1.7z"/></svg></i></div>
    <div class="marca"><svg viewBox="0 0 64 64"><rect width="64" height="64" rx="20" fill="#8174fa"/><path d="M18 45V19h7l14 17V19h7v26h-7L25 28v17z" fill="#fff"/><path d="m44 10 1.7 4.3L50 16l-4.3 1.7L44 22l-1.7-4.3L38 16l4.3-1.7z" fill="#d1ffc1"/></svg></div>
  </div>
  <div class="resto resto-2"><div class="miolo">
    <div class="titulo">Abrindo o Nexo</div>
    <p class="etapa"><span id="etapa">Procurando o servidor</span><span class="pontos" aria-hidden="true"><i></i><i></i><i></i></span></p>
    <div class="resto resto-3"><div class="miolo">
      <div class="xp" aria-hidden="true"><div class="seg" id="seg"></div><div class="rotulos"><span>Carregando</span><b id="pct">0%</b></div></div>
      <div class="dica" aria-hidden="true"><small>Dica</small><p id="dica"></p></div>
    </div></div>
    <p class="devagar">Está demorando mais que o normal. Se o servidor estiver fora do ar, o Nexo avisa e deixa você trocar o endereço.</p>
  </div></div>
</main>
<script>
  // O andamento é uma subida que desacelera e nunca passa de 92%: a janela só sai daqui quando a sala chega, e
  // isso é o processo principal que decide (main.js) -- esta página não sabe quando.
  const CIRCUNFERENCIA = 2 * Math.PI * 76;
  const arco = document.getElementById('arco'), ponta = document.getElementById('ponta'), seg = document.getElementById('seg');
  seg.innerHTML = '<i></i>'.repeat(12);
  const inicio = Date.now();
  const ETAPAS = [[0, 'Procurando o servidor'], [0.3, 'Conectando'], [0.6, 'Abrindo a sua sala'], [0.8, 'Quase lá']];
  function andar() {
    const p = Math.max(0.06, 0.92 * (1 - Math.exp(-(Date.now() - inicio) / 5200)));
    arco.style.strokeDasharray = `${(p * CIRCUNFERENCIA).toFixed(1)} ${CIRCUNFERENCIA.toFixed(1)}`;
    ponta.style.transform = `rotate(${(p * 360).toFixed(1)}deg)`;
    const acesos = Math.floor(p * 12);
    seg.childNodes.forEach((s, i) => { s.classList.toggle('on', i < acesos); s.classList.toggle('prox', i === acesos); });
    document.getElementById('pct').textContent = `${Math.round(p * 100)}%`;
    document.getElementById('etapa').textContent = ETAPAS.reduce((t, [m, f]) => (p >= m ? f : t), ETAPAS[0][1]);
  }
  setInterval(andar, 140); andar();
  // A tela é progressiva (public/carregando.js): só a marca no começo, o título depois de 1,2 s, e a tela completa
  // depois de 3 s -- uma abertura rápida nunca vê mais que a marca. O grau só sobe.
  let nivel = 0;
  function definirNivel(novo) { if (novo > nivel) { nivel = novo; document.body.dataset.nivel = String(novo); } }
  definirNivel(1);
  setTimeout(() => definirNivel(2), 1200);
  setTimeout(() => definirNivel(3), 3000);
  setTimeout(() => { definirNivel(2); document.body.classList.add('devagar-sim'); }, 12000);
  // As mesmas dicas da tela de carregamento da sala -- só frases que o Nexo cumpre hoje.
  const DICAS = [
    'Ctrl K abre a busca de amigos e de salas — até no meio de uma chamada.',
    'Clique no número do volume para digitar o valor exato, de 0 a 200%.',
    'Arraste a borda do chat para deixá-lo do tamanho que você preferir. O Nexo lembra.',
    'A mesa de sons toca um som para a sala toda: um de cada pessoa por vez.',
    'Ctrl+Shift+M liga e desliga o microfone, e Ctrl+Shift+D, o fone.',
    'Seu cartão de perfil aparece para todo mundo na sala: borda, moldura, bolha e conquistas.',
    'O botão Focar do chat esconde o palco e deixa só a conversa.',
    'No aplicativo de mesa, o som do sistema vai junto com a tela compartilhada.'
  ];
  const dica = document.getElementById('dica');
  let indice = Math.floor(Math.random() * DICAS.length);
  dica.textContent = DICAS[indice];
  setInterval(() => {
    dica.classList.add('troca');
    setTimeout(() => { indice = (indice + 1) % DICAS.length; dica.textContent = DICAS[indice]; dica.classList.remove('troca'); }, 240);
  }, 5500);
</script>
</body>
</html>
